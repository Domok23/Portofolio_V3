<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "dark" && t !== "light") t = "light";
          var dark = t === "dark";
          var bg = dark ? "#09090b" : "#fafafa";
          var fg = dark ? "#fafafa" : "#09090b";
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = t;
          root.style.backgroundColor = bg;
          document.write(
            '<style id="theme-boot">html,body,#root{background:' +
              bg +
              "!important;background-color:" +
              bg +
              "!important;color:" +
              fg +
              ";min-height:100%;}html{color-scheme:" +
              t +
              ";}</style>"
          );
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#FAFAFA" id="meta-theme-color" />
